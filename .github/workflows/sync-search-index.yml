name: Sync Search Index

on:
  # Run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

# No deployment permissions needed - this only calls the already-deployed
# app's own /api/v1/* ingest endpoints over signed HTTPS requests.
# `contents: write` is only for the keepalive commit below (updating
# .github/last-sync.json): GitHub disables scheduled workflows after 60 days
# without repository activity, so each run commits its own timestamp.
permissions:
  contents: write

# Allow only one concurrent run - the backend also mutex-checks in-progress
# sync runs (see CLAUDE.md's "No cron trigger" section), but avoiding two
# Actions runs racing each other client-side is cheaper than relying on the
# 409 alone.
concurrency:
  group: "sync-search-index"
  cancel-in-progress: false

jobs:
  sync-search-index:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync search index
        id: sync
        env:
          GIT_GITHUB_OWNER: ${{ secrets.GIT_GITHUB_OWNER }}
          GIT_GITHUB_TOKEN: ${{ secrets.GIT_GITHUB_TOKEN }}
          GIT_GITLAB_OWNER: ${{ secrets.GIT_GITLAB_OWNER }}
          GIT_GITLAB_TOKEN: ${{ secrets.GIT_GITLAB_TOKEN }}
          SEARCH_API_BASE_URL: ${{ secrets.SEARCH_API_BASE_URL }}
          SEARCH_API_KEY_ID: ${{ secrets.SEARCH_API_KEY_ID }}
          SEARCH_API_PRIVATE_KEY: ${{ secrets.SEARCH_API_PRIVATE_KEY }}
        run: pnpm run sync-search

      # Keepalive: record this run in .github/last-sync.json and push it, so
      # the repo always has recent activity and GitHub never auto-disables
      # this scheduled workflow. Runs even when the sync step fails (status is
      # recorded), but not on cancellation. main does not trigger deploy.yml
      # (release* only); "[skip ci]" additionally skips any other CI hooks.
      - name: Record last sync time
        if: ${{ !cancelled() }}
        env:
          SYNC_STATUS: ${{ steps.sync.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > .github/last-sync.json <<EOF
          {
            "lastRunAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "${SYNC_STATUS}",
            "trigger": "${{ github.event_name }}",
            "runUrl": "${RUN_URL}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-sync.json
          git commit -m "chore: record search index sync ${SYNC_STATUS} [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
